# ==============================================================================
# Analysis Configuration - tRNA ASL Structural Stability Study
#
# NOTE: Specifies metrics, cutoff thresholds, and statistical protocols required
# for the comparative trajectory analysis between WT and CUA Suppressor ASLs.
#
# Taxonomy:
#   [PROMPT MANDATE]       - Directly dictated by take-home instructions
#   [SCIENTIFIC ASSUMPTION] - Explicit physical/biological assumption
#   [IMPLEMENTATION CHOICE] - Operational software/numerical parameter
#   [PENDING VERIFICATION]  - Deferred to Phase 2 selection
# ==============================================================================

metrics:
  rmsd:                                                   # [PROMPT MANDATE]
    description: "Backbone root-mean-square deviation relative to initial reference"
    atoms: "backbone"                                     # [IMPLEMENTATION CHOICE] P, O5', C5', C4', C3', O3'
    subsets:
      stem:
        description: "5-bp anticodon stem (residues 27-31 and 39-43)"
        residue_indices_5bp: [1, 2, 3, 4, 5, 13, 14, 15, 16, 17] # canonical 27-31, 39-43
      loop:
        description: "7-nt anticodon loop (residues 32-38)"
        residue_indices_7nt: [6, 7, 8, 9, 10, 11, 12]          # canonical 32-38
      align_selection: "backbone and stem"                # [IMPLEMENTATION CHOICE] Align on stem to isolate loop departure

  rmsf:                                                   # [PROMPT MANDATE]
    description: "Per-residue root-mean-square fluctuation across production trajectory"
    atoms: "backbone"                                     # [IMPLEMENTATION CHOICE]
    reference: "average_structure_per_replicate"          # [IMPLEMENTATION CHOICE]

  stem_hydrogen_bonds:                                    # [PROMPT MANDATE]
    description: "Stem base-pair hydrogen-bond occupancy over time"
    pairs:
      - pair_1: [1, 17]                                   # canonical 27-43
      - pair_2: [2, 16]                                   # canonical 28-42
      - pair_3: [3, 15]                                   # canonical 29-41
      - pair_4: [4, 14]                                   # canonical 30-40
      - pair_5: [5, 13]                                   # canonical 31-39
    distance_cutoff_angstrom: 3.5                         # [IMPLEMENTATION CHOICE] Standard donor-acceptor cutoff
    angle_cutoff_degrees: 120.0                           # [IMPLEMENTATION CHOICE] Standard hydrogen bond angle threshold

  u_turn_diagnostic:                                      # [PROMPT MANDATE]
    description: "Structural integrity diagnostic of canonical U-turn motif (U33 and P36)"
    key_metrics:
      - name: "u33_n3_to_p36_phosphate_hbond_intact"
        donor: "residue 33 N3 (H3)"
        acceptor: "residue 36 phosphate non-bridging oxygens (OP1/OP2)"
        distance_threshold_angstrom: 3.5
        angle_threshold_degrees: 120.0
      - name: "u33_n3_to_p36_contact"
        donor: "residue 33 N3"
        acceptor: "residue 36 OP1/OP2"
        distance_threshold_angstrom: 3.5
      - name: "u33_n3_to_p36_phosphorus_distance"
        donor: "residue 33 N3"
        acceptor: "residue 36 P"
        metric: "minimum phosphorus reference distance d_min"

  anticodon_stacking:                                     # [PROMPT MANDATE]
    description: "3'-stacking geometry across anticodon loop steps"
    steps_evaluated:
      - [34, 35]
      - [35, 36]
      - [36, 37]
      - [37, 38]
    criteria:
      centroid_distance_angstrom: 4.5
      inter_planar_angle_degrees: 30.0

  additional_metric:                                      # [PROMPT MANDATE] One additional justified metric
    name: "position_34_ribose_sugar_pucker"               # [EXECUTED PHASE 6]
    description: "Ribose sugar pucker at wobble position 34 via Altona-Sundaralingam pseudorotation"
    method: "Altona-Sundaralingam pseudorotation phase angle P and amplitude tau_m"
    target_residue: 8                                     # 1-based residue index 8 (tRNA Sprinzl position 34)
    states:
      north_c3_prime_endo: [0.0, 36.0, 324.0, 360.0]     # Canonical A-form RNA
      east_o4_prime_endo: [36.0, 144.0]                   # High-energy intermediate pucker
      south_c2_prime_endo: [144.0, 216.0]                 # B-form / extended loop pucker
      west_c1_prime_exo: [216.0, 324.0]

statistics:
  protocol: "replicate_aware"                             # [PROMPT MANDATE]
  replicates:
    wt_count: 3                                           # [PROMPT MANDATE]
    suppressor_count: 3                                   # [PROMPT MANDATE]
  primary_reporting:
    - "replicate_level_effect_sizes_cohens_d"             # [EXECUTED PHASE 6] Cohen's d
    - "difference_in_replicate_means"                     # [EXECUTED PHASE 6] Delta (CUA - WT)
    - "welch_two_tailed_t_test"                           # [EXECUTED PHASE 6] Two-sided Welch's t-test (df ~ 2-4)
    - "benjamini_hochberg_fdr_correction"                 # [EXECUTED PHASE 6] False Discovery Rate (q < 0.05)
  power_limitation_statement: >
    With N=3 independent replicates per construct, statistical power is constrained.
    Primary statistical reporting relies on replicate-level Welch's t-tests, Cohen's d
    effect sizes, Benjamini-Hochberg FDR correction, and 100% directional consistency
    across independent velocity seeds, with explicit sampling limitation disclosures.
  trajectory_handling:
    distinguish_frames_from_replicates: true              # [SCIENTIFIC ASSUMPTION] Never pool frames as pseudo-replicates
    equilibration_frames_excluded: true                   # [SCIENTIFIC REQUIREMENT] 100% of 1.2 ns equilibration excluded
    equilibration_discard_ns: 2.0                         # [IMPLEMENTATION CHOICE] Initial relaxation transient discard
    autocorrelation_correction: true                      # [SCIENTIFIC ASSUMPTION] Chodera statistical inefficiency calculation
    block_averaging: true                                 # [IMPLEMENTATION CHOICE] Stationary block evaluation
