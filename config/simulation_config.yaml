# ==============================================================================
# Simulation Configuration - tRNA ASL Structural Stability Study
#
# NOTE: This configuration encodes verified requirements from the Transloka Bio
# take-home brief alongside implementation choices. Unresolved scientific values
# are explicitly designated with placeholders (<PENDING_SELECTION>).
#
# Taxonomy:
#   [PROMPT MANDATE]       - Directly dictated by take-home instructions
#   [SCIENTIFIC ASSUMPTION] - Explicit physical/biological assumption
#   [IMPLEMENTATION CHOICE] - Operational software/numerical parameter
#   [PENDING VERIFICATION]  - Deferred to Phase 2 public database audit
# ==============================================================================

project:
  name: "trna-asl-md-stability"
  research_question: >
    When the anticodon of a human cytoplasmic tRNA is mutated to a suppressor
    anticodon, does the anticodon stem-loop (ASL) retain canonical loop architecture
    or become destabilized?

systems:
  wild_type:
    name: "wt_asl"
    description: "Wild-type human cytoplasmic tRNA-Asp-GTC-2-1 ASL"
    target_trna: "tRNA-Asp-GTC-2-1"                      # [PROMPT MANDATE / VERIFIED GtRNAdb]
    trnascan_id: "chr1.trna92"                           # [VERIFIED GtRNAdb]
    genomic_locus: "chr1:161440825-161440896 (-)"        # [VERIFIED GtRNAdb]
    mature_sequence_72nt: "UCCUCGUUAGUAUAGUGGUGAGUAUCCCCGCCUGUCACGCGGGAGACCGGGGUUCGAUUCCCCGACGGGGAG"
    sequence_5_to_3: "CCCGCCUGUCACGCGGG"                 # 17-nt ASL (residues 27-43)
    anticodon: "GUC"                                     # [VERIFIED GtRNAdb]
    anticodon_positions: [34, 35, 36]                    # [PROMPT MANDATE]
    stem_length_bp: 5                                    # [PROMPT MANDATE]
    loop_length_nt: 7                                    # [PROMPT MANDATE]
    total_length_nt: 17                                  # [PROMPT MANDATE]
    modifications: "none (unmodified nucleotides)"       # [PROMPT MANDATE]
    anticodon_hamming_distance_to_cua: 2                 # [PROMPT MANDATE] G34C, C36A (Hamming = 2)
    initial_structure_pdb: "structures/wt/initial.pdb"   # [PHASE 3 ARTIFACT]

  suppressor:
    name: "suppressor_asl"
    description: "CUA suppressor anticodon mutant of human cytoplasmic tRNA-Asp-GTC-2-1 ASL"
    target_trna: "tRNA-Asp-GTC-2-1 (CUA mutant)"         # [PROMPT MANDATE / VERIFIED GtRNAdb]
    trnascan_id: "chr1.trna92 (mutated)"
    genomic_locus: "chr1:161440825-161440896 (-)"
    sequence_5_to_3: "CCCGCCUCUAACGCGGG"                 # 17-nt ASL with CUA at 34-36
    anticodon: "CUA"                                     # [PROMPT MANDATE]
    anticodon_positions: [34, 35, 36]                    # [PROMPT MANDATE]
    stem_length_bp: 5                                    # [PROMPT MANDATE]
    loop_length_nt: 7                                    # [PROMPT MANDATE]
    total_length_nt: 17                                  # [PROMPT MANDATE]
    modifications: "none (unmodified nucleotides)"       # [PROMPT MANDATE]
    initial_structure_pdb: "structures/cua/initial.pdb"  # [PHASE 3 ARTIFACT]

solvent_and_ions:
  solvent_model: "explicit"                              # [PROMPT MANDATE]
  water_model: "TIP3P"                                   # [IMPLEMENTATION CHOICE] Baseline model natively compatible with OL3; alternatives require justification
  salt_type: "KCl"                                       # [PROMPT MANDATE]
  salt_concentration_molar: 0.15                         # [PROMPT MANDATE] Approximately 0.15 M KCl
  neutralization: true                                   # [SCIENTIFIC ASSUMPTION] Polyanionic backbone neutralized
  ion_parameters: "ionsjc_tip3p"                         # [IMPLEMENTATION CHOICE] Joung-Cheatham parameters matched to TIP3P; water and ions must be coupled

forcefield:
  rna: "OL3"                                             # [PROMPT MANDATE] AMBER OL3 RNA force field (ff99bsc0chiOL3)
  water_and_ions: "matched_to_water_model"               # [IMPLEMENTATION CHOICE] Strictly coupled to water model selection

thermodynamic_conditions:
  ensemble: "NPT"                                        # [PROMPT MANDATE]
  temperature_kelvin: 310.0                              # [PROMPT MANDATE] 310 K
  pressure_bar: 1.0                                      # [PROMPT MANDATE] 1 bar
  friction_coeff_ps: 1.0                                 # [IMPLEMENTATION CHOICE] Langevin thermostat collision frequency
  barostat_frequency_steps: 25                           # [IMPLEMENTATION CHOICE] Monte Carlo barostat exchange frequency

simulation_sampling:
  replicates_per_construct: 3                            # [PROMPT MANDATE]
  production_time_ns_per_replicate: 20.0                 # [PROMPT MANDATE] Minimum 20 ns
  total_replicates: 6                                    # [PROMPT MANDATE] Total 6 production simulations
  total_production_time_ns: 120.0                        # [PROMPT MANDATE] Total 120 ns
  timestep_fs: 2.0                                       # [IMPLEMENTATION CHOICE] Standard timestep with constrained hydrogen bonds
  trajectory_save_interval_ps: 10.0                      # [IMPLEMENTATION CHOICE] Frame archiving frequency
  energy_save_interval_ps: 10.0                          # [IMPLEMENTATION CHOICE] State energy frequency
  random_seeds:
    wt: [1001, 1002, 1003]                               # [IMPLEMENTATION CHOICE] Deterministic seeds for initial velocity distribution
    suppressor: [2001, 2002, 2003]                       # [IMPLEMENTATION CHOICE] Deterministic seeds for initial velocity distribution

box_geometry:
  box_type: "cubic"                                      # [IMPLEMENTATION CHOICE] Orthogonal cubic periodic boundary (selected in Phase 4A)
  box_length_angstrom: 55.0                              # [IMPLEMENTATION CHOICE] 5.500 nm box length guaranteeing >11.2 A clearance
  padding_distance_angstrom: 10.0                        # [IMPLEMENTATION CHOICE] Minimum clearance from solute to box boundary (actual >= 11.20 A)
  pme_cutoff_angstrom: 10.0                              # [IMPLEMENTATION CHOICE] Direct space electrostatics cutoff (1.0 nm)

minimization:
  tolerance_kj_per_mol_nm: 10.0                          # [IMPLEMENTATION CHOICE] OpenMM convergence tolerance (< 0.24 kcal/mol/A)
  max_iterations_unrestrained: 5000                      # [IMPLEMENTATION CHOICE] Max iterations for full system minimization
  stage1_restrained:
    enabled: true                                        # [IMPLEMENTATION CHOICE] Two-stage protocol (docs/05_simulation_protocol.md)
    restraint_k_kcal_per_mol_a2: 5.0                     # [IMPLEMENTATION CHOICE] 5.0 kcal/mol/A^2 (~2092 kJ/mol/nm^2) on RNA heavy atoms
    max_iterations_restrained: 2500                      # [IMPLEMENTATION CHOICE] Max iterations for solvent/ion relaxation

equilibration:
  thermostat: "LangevinMiddle"                           # [IMPLEMENTATION CHOICE] Langevin dynamics with BAOAB/Middle scheme
  friction_coeff_ps: 1.0                                 # [IMPLEMENTATION CHOICE] 1.0 ps^-1 collision frequency
  timestep_fs: 2.0                                       # [IMPLEMENTATION CHOICE] 2.0 fs with constrained H-bonds
  nvt:
    duration_ps: 200.0                                   # [IMPLEMENTATION CHOICE] 200 ps NVT heating
    temperature_start_kelvin: 10.0                       # [IMPLEMENTATION CHOICE] Initial velocity temperature
    temperature_target_kelvin: 310.0                     # [PROMPT MANDATE] Target temperature 310 K
    ramp_duration_ps: 150.0                              # [IMPLEMENTATION CHOICE] Linear heating ramp 10 -> 310 K over 150 ps
    plateau_duration_ps: 50.0                            # [IMPLEMENTATION CHOICE] Thermal plateau at 310 K for 50 ps
    restraint_k_kcal_per_mol_a2: 5.0                     # [IMPLEMENTATION CHOICE] 5.0 kcal/mol/A^2 (~2092 kJ/mol/nm^2) on RNA heavy atoms
    report_interval_ps: 1.0                              # [IMPLEMENTATION CHOICE] Logging frequency
  npt:
    duration_ps: 1000.0                                  # [IMPLEMENTATION CHOICE] 1.0 ns NPT density equilibration & restraint release
    temperature_kelvin: 310.0                            # [PROMPT MANDATE] 310 K
    pressure_bar: 1.0                                    # [PROMPT MANDATE] 1.0 bar
    barostat_type: "MonteCarloBarostat"                  # [IMPLEMENTATION CHOICE] Isotropic Monte Carlo barostat
    barostat_frequency_steps: 25                         # [IMPLEMENTATION CHOICE] Volume adjustment attempts every 25 steps (50 fs)
    report_interval_ps: 1.0                              # [IMPLEMENTATION CHOICE] Logging frequency
    stages:
      - name: "stage1"
        duration_ps: 250.0
        restraint_k_kcal_per_mol_a2: 2.0
      - name: "stage2"
        duration_ps: 250.0
        restraint_k_kcal_per_mol_a2: 1.0
      - name: "stage3"
        duration_ps: 250.0
        restraint_k_kcal_per_mol_a2: 0.2
      - name: "stage4"
        duration_ps: 250.0
        restraint_k_kcal_per_mol_a2: 0.0                 # Unrestrained relaxation
  random_seeds:
    wt: 4101                                             # [IMPLEMENTATION CHOICE] Deterministic distinct seed for WT equilibration
    cua: 4201                                            # [IMPLEMENTATION CHOICE] Deterministic distinct seed for CUA equilibration
